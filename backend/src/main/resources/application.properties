spring.application.name=rar-cafe-backend
server.port=8081

# H2 in-memory database - zero setup required
spring.datasource.url=jdbc:h2:mem:rarcafe;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (visit http://localhost:8080/h2-console while running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS-friendly Jackson output
spring.jackson.serialization.write-dates-as-timestamps=false
